<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var isPreview = /[?&]preview=1/.test(location.search);
  var SAMPLE = 'FINAL SHOWDOWN BETWEEN MONSTER REGION!';
  var EASE_OUT = 'cubic-bezier(.16,.84,.24,1)', EASE_IN = 'cubic-bezier(.5,0,.75,0)';

  /* ═════════ HEADLINE ═════════ */
  var Headline = (function () {
    var backer = $('hl-backer'), logo = $('hl-logo'), box = $('hl-text');
    var visible = false, shownText = '', busy = Promise.resolve(), MAX_W = 800, MAX_PX = 65, MIN_PX = 10;

    function anim(el, frames, opts) { return el.animate(frames, Object.assign({ fill: 'both' }, opts)).finished.catch(function () {}); }
    function fitSize(text) {
      var c = document.createElement('canvas').getContext('2d');
      c.font = '700 100px "Tandelle"';
      var w = c.measureText(text).width || 1;
      return Math.max(MIN_PX, Math.min(MAX_PX, 100 * MAX_W / w * 0.985));
    }
    function build(text) {                                  // one span per character (so they can stagger)
      box.innerHTML = '';
      box.style.fontSize = fitSize(text) + 'px';
      var chars = [];
      text.split('').forEach(function (ch) {
        var s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; box.appendChild(s); chars.push(s);
      });
      /* safety: the real laid-out width can differ a hair from the canvas estimate — shrink until nothing is clipped */
      for (var k = 0; k < 4 && box.scrollWidth > MAX_W; k++) box.style.fontSize = (parseFloat(box.style.fontSize) * MAX_W / box.scrollWidth * 0.99) + 'px';
      return chars;
    }
    function charsIn(chars, base) {
      return Promise.all(chars.map(function (s, i) {
        return anim(s, [{ transform: 'translateY(115%)' }, { transform: 'translateY(0)' }], { duration: 520, delay: base + i * 16, easing: EASE_OUT });
      }));
    }
    function charsOut(chars, base) {
      return Promise.all(chars.map(function (s, i) {
        return anim(s, [{ transform: 'translateY(0)' }, { transform: 'translateY(-115%)' }], { duration: 340, delay: base + i * 9, easing: EASE_IN });
      }));
    }
    function curChars() { return Array.prototype.slice.call(box.children); }

    function playIn(text) {
      shownText = text;
      var chars = build(text);
      backer.getAnimations().forEach(function (a) { a.cancel(); }); logo.getAnimations().forEach(function (a) { a.cancel(); });
      var p = [
        anim(backer, [
          { opacity: 0, transform: 'translateY(28px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 720, easing: EASE_OUT }),
        anim(logo, [
          { opacity: 0, transform: 'translateX(-34px) scale(.92)' },
          { opacity: 1, transform: 'translateX(0) scale(1)' }
        ], { duration: 560, delay: 300, easing: EASE_OUT }),
        charsIn(chars, 420)
      ];
      return Promise.all(p);
    }
    function playOut() {
      var chars = curChars();
      return Promise.all([
        charsOut(chars, 0),
        anim(logo, [{ opacity: 1, transform: 'translateX(0) scale(1)' }, { opacity: 0, transform: 'translateX(-24px) scale(.94)' }], { duration: 340, delay: 120, easing: EASE_IN }),
        anim(backer, [
          { opacity: 1, transform: 'translateY(0)' },
          { opacity: 0, transform: 'translateY(22px)' }
        ], { duration: 520, delay: 220, easing: EASE_IN })
      ]).then(function () { box.innerHTML = ''; shownText = ''; });
    }
    function swapText(text) {                                // headline changed while on air: old text rises out, new text rises in
      if (text === shownText) return Promise.resolve();
      return charsOut(curChars(), 0).then(function () {
        shownText = text;
        return charsIn(build(text), 40);
      });
    }

    function queue(fn) { busy = busy.then(fn, fn); return busy; }
    return {
      show: function (text) { if (visible) return; visible = true; queue(function () { return playIn(text); }); },
      hide: function () { if (!visible) return; visible = false; queue(playOut); },
      setText: function (text) { if (!visible) return; queue(function () { return visible ? swapText(text) : null; }); },
      isVisible: function () { return visible; }
    };
  })();


  /* ═════════ NAME TAG ═════════ */
  var NameTag = (function () {
    var NAME_MAX_PX = 42, EASE_SNAP = 'cubic-bezier(.2,.9,.25,1)', EASE_POP = 'cubic-bezier(.34,1.56,.64,1)', EASE_FAST_IN = 'cubic-bezier(.55,0,.8,.3)';
    var A = '/assets/overlay/MCT/L3/';
    /* geometry read off the references (1920x1080) */
    var VARIANTS = {
      1: { bg: { src: A + 'mct_singlebg.png', left: 636, w: 648 }, icon: { left: 656, top: 923 },
           slots: [{ box: 756, w: 520, align: 'left' }] },
      2: { bg: { src: A + 'mct_doublebg.png', left: 298, w: 1324 }, icon: { left: 928, top: 922 },
           slots: [{ box: 350, w: 520, align: 'right' }, { box: 1047, w: 520, align: 'left' }] },
      3: { bg: { src: A + 'mct_triplebg.png', left: 69, w: 1782 }, icon: null,
           slots: [{ box: 223.5, w: 480, align: 'center' }, { box: 719.5, w: 480, align: 'center' }, { box: 1216.5, w: 480, align: 'center' }] }
    };
    var stage = $('stage'), tags = {}, current = 0, busy = Promise.resolve(), casters = ['', '', ''];

          ps.push(sink(kids(el), 0).then(function () { return rise(chars(el, c[f[1]]), 0); }));
        });
        if (c.name !== oc[k].name) { setPhoto(k, c.name); var nm = $('tp-name' + k); ps.push(sink(kids(nm), 0).then(function () { return rise(chars(nm, c.name.toUpperCase()), 0, 12); })); }
      });
      if (d.matchLine !== old.matchLine) ps.push(anim($('tp-match'), [{ opacity: .2 }, { opacity: 1 }], { duration: 300 }));
      return Promise.all(ps);
    }
    function key(d) { return d ? JSON.stringify(d) : ''; }
    function queue(fn) { busy = busy.then(fn, fn); return busy; }
    return {
      setData: function (d) { data = d; if (visible) queue(function () { if (!visible) return null; if (!shown) return playIn(data); return key(shown) !== key(data) ? swap(data) : null; }); },   /* restored on air before the data arrived -> plays in now */
      show: function () { if (visible) return; visible = true; queue(function () { return data ? playIn(data) : null; }); },
      hide: function () { if (!visible) return; visible = false; queue(function () { return shown ? playOut() : null; }); },
      isVisible: function () { return visible; }
    };
  })();
  function parseCasters(st) {
    var c = (st && st.casters) || [];
    return [0, 1, 2].map(function (i) { var v = String(c[i] == null ? '' : c[i]).trim(); return /^none$/i.test(v) ? '' : v; });
  }
  /* ═════════ COUNTDOWN BUG (top quadrant) ═════════
     Data (Match Board): stage, match, series (BO n), home / away (white logo <TRI>_3.png, flag via /api/roster name, tricode, series score),
     and its own countdown state.bugTimer {running, endAt, remaining} (Match Board "Bug Timer", server clock — serverNow cancels skew).
     At 0 the timer + its navy strip + the DRAFT PICK marquee fade out; they come back when the clock is set above 0 again.
     In: plate drops in, grouper slides from the left, logo pops, nameplates / strip fade up, then the text rises (letters / digits).
     Out: reverse, faster. Live edits re-roll only what changed. */
  var CountdownBug = (function () {
    var EASE = 'cubic-bezier(.16,.84,.24,1)', EASE_IN = 'cubic-bezier(.55,0,.75,.2)', BACK = 'cubic-bezier(.34,1.45,.64,1)';
    var visible = false, busy = Promise.resolve(), data = null, shown = null, roster = null, tick = null, timerOn = null, lastTxt = '';
    $('cb-marq-strip').textContent = 'DRAFT PICK  •  DRAFT PICK  •  DRAFT PICK  •  DRAFT PICK  •  ';
    function anim(el, frames, opts) { return el.animate(frames, Object.assign({ fill: 'both' }, opts)).finished.catch(function () {}); }
    function fade(el, d, from, to, ms) { return anim(el, [Object.assign({ opacity: 0 }, from || {}), Object.assign({ opacity: 1, transform: (to || 'none') }, {})], { duration: ms || 420, delay: d, easing: EASE }); }
    function gone(el, d) { return anim(el, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: 200, delay: d, easing: EASE_IN }); }
    function chars(el, text) { el.innerHTML = ''; return String(text).split('').map(function (ch) { var x = document.createElement('span'); x.className = 'ch'; x.textContent = ch; el.appendChild(x); return x; }); }
    function rise(sp, d, step) { return Promise.all(sp.map(function (x, i) { return anim(x, [{ transform: 'translateY(115%)' }, { transform: 'translateY(0)' }], { duration: 360, delay: d + i * (step || 16), easing: EASE }); })); }
    function sink(sp, d) { return Promise.all(sp.map(function (x, i) { return anim(x, [{ transform: 'translateY(0)' }, { transform: 'translateY(-115%)' }], { duration: 170, delay: d + i * 5, easing: EASE_IN }); })); }
    function kids(el) { return Array.prototype.slice.call(el.children); }
    function setImg(img, src, fb) { if (!src) { img.removeAttribute('src'); return; } img.onerror = function () { img.onerror = function () { img.removeAttribute('src'); }; if (fb) img.src = fb; else img.removeAttribute('src'); }; img.src = src; }
    function loadRoster() { return roster || (roster = fetch('/api/roster', { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return null; })); }
    function flag(img, tri) {
      if (!tri) { img.removeAttribute('src'); return; }
      loadRoster().then(function (ro) {
        var t = ro && ro.teams && Object.keys(ro.teams).map(function (k) { return ro.teams[k]; }).filter(function (x) { return String(x.tag || '').toUpperCase() === tri; })[0];
        setImg(img, t && t.name ? '/assets/flags/' + encodeURIComponent(t.name + '_FLAG') + '.webp' : '');
      });
    }
    function remain(d) {
      var t = d.timer || {};
      return (t.running && t.endAt) ? Math.max(0, Math.round((t.endAt - (Date.now() + d.offset)) / 1000)) : Math.max(0, Math.round(t.remaining || 0));
    }
    function fmt(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
    function fillArt(d) {
      [[1, d.home], [2, d.away]].forEach(function (r) {
        var tri = r[1];
        setImg($('cb-logo' + r[0]), tri ? '/assets/team/logos/' + encodeURIComponent(tri) + '_3.png' : '', tri ? '/assets/team/logos/' + encodeURIComponent(tri) + '.png' : '');
        flag($('cb-flag' + r[0]), tri);
      });
      $('cb-match').textContent = d.match; $('cb-bo').textContent = d.bo;
    }
    /* timer block on/off (0:00 hides the timer, its strip and the marquee) */
    function timerBlock(on, instant) {
      if (on === timerOn) return; timerOn = on;
      [$('cb-tbg'), $('cb-marq'), $('cb-timer')].forEach(function (el) {
        el.getAnimations().forEach(function (a) { if (a.effect && a.effect.getKeyframes().some(function (k) { return 'opacity' in k && !('transform' in k); })) a.cancel(); });
        anim(el, [{ opacity: on ? 0 : 1 }, { opacity: on ? 1 : 0 }], { duration: instant ? 1 : 350, easing: on ? EASE : EASE_IN });
      });
    }
    function startTick() {
      clearInterval(tick);
      tick = setInterval(function () {
        if (!shown || !data) return;
        var r = remain(data), txt = fmt(r);
        if (txt !== lastTxt) { lastTxt = txt; var sp = kids($('cb-timer')); if (sp.length === txt.length) txt.split('').forEach(function (ch, i) { sp[i].textContent = ch; }); else { chars($('cb-timer'), txt).forEach(function (x) { x.style.transform = 'none'; }); } }
        timerBlock(r > 0);
      }, 200);
    }
    function playIn(d) {
      shown = d; fillArt(d);
      var r = remain(d); lastTxt = fmt(r); timerOn = null;
      var ps = [
        fade($('cb-main'), 0, { transform: 'translateY(-16px)' }),
        fade($('cb-grouper'), 80, { transform: 'translateX(-28px)' }, 'none', 460),
        anim($('cb-sea'), [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 140, easing: BACK }),
        fade($('cb-plate1'), 200, { transform: 'translateY(10px)' }), anim($('cb-plate2'), [{ opacity: 0, transform: 'scaleX(-1) translateY(10px)' }, { opacity: 1, transform: 'scaleX(-1)' }], { duration: 420, delay: 240, easing: EASE }),
        fade($('cb-flag1'), 300, { transform: 'translateY(6px)' }), fade($('cb-flag2'), 330, { transform: 'translateY(6px)' }),
        fade($('cb-logo1'), 300, { transform: 'scale(.85)' }), fade($('cb-logo2'), 330, { transform: 'scale(.85)' }),
        anim($('cb-vs'), [{ opacity: 0, transform: 'scale(.5)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 420, easing: BACK }),
        fade($('cb-match'), 440, { transform: 'translateY(6px)' }), fade($('cb-bo'), 470, { transform: 'translateY(-6px)' }),
        rise(chars($('cb-stage'), d.stage), 220, 14),
        rise(chars($('cb-score1'), d.s1), 380), rise(chars($('cb-score2'), d.s2), 420),
        rise(chars($('cb-tri1'), d.home || ''), 360), rise(chars($('cb-tri2'), d.away || ''), 400)];
      timerOn = r > 0;
      if (timerOn) ps.push(fade($('cb-tbg'), 260), fade($('cb-marq'), 320), rise(chars($('cb-timer'), lastTxt), 460, 30));
      startTick();
      return Promise.all(ps);
    }
    function playOut() {
      clearInterval(tick);
      var ps = [sink(kids($('cb-timer')), 0), sink(kids($('cb-score1')), 0), sink(kids($('cb-score2')), 20), sink(kids($('cb-tri1')), 0), sink(kids($('cb-tri2')), 20), sink(kids($('cb-stage')), 40)];
      ['cb-vs', 'cb-match', 'cb-bo', 'cb-flag1', 'cb-flag2', 'cb-logo1', 'cb-logo2', 'cb-marq', 'cb-tbg', 'cb-plate1', 'cb-sea'].forEach(function (id, i) { ps.push(gone($(id), 60 + i * 12)); });
      ps.push(anim($('cb-plate2'), [{ opacity: 1, transform: 'scaleX(-1)' }, { opacity: 0, transform: 'scaleX(-1) translateY(-8px)' }], { duration: 200, delay: 140, easing: EASE_IN }),
        anim($('cb-grouper'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-24px)' }], { duration: 240, delay: 200, easing: EASE_IN }),
        anim($('cb-main'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-14px)' }], { duration: 260, delay: 240, easing: EASE_IN }));
      return Promise.all(ps).then(function () { shown = null; timerOn = null; ['cb-timer', 'cb-score1', 'cb-score2', 'cb-tri1', 'cb-tri2', 'cb-stage'].forEach(function (id) { $(id).innerHTML = ''; }); });
    }
    function swap(d) {
      var o = shown; shown = d; fillArt(d);
      var ps = [];
      [['cb-score1', 's1'], ['cb-score2', 's2'], ['cb-tri1', 'home'], ['cb-tri2', 'away'], ['cb-stage', 'stage']].forEach(function (f) {
        if (o[f[1]] === d[f[1]]) return;
        var el = $(f[0]);
        ps.push(sink(kids(el), 0).then(function () { return rise(chars(el, d[f[1]] || ''), 0); }));
      });
      return Promise.all(ps);
    }
    function key(d) { return d ? JSON.stringify([d.stage, d.match, d.bo, d.home, d.away, d.s1, d.s2]) : ''; }   // the timer ticks on its own
    function queue(fn) { busy = busy.then(fn, fn); return busy; }
    return {
      setData: function (d) {
        data = d;
        if (visible) queue(function () { if (!visible) return null; if (!shown) return playIn(data); return key(shown) !== key(data) ? swap(data) : null; });
      },
      show: function () { if (visible) return; visible = true; queue(function () { return data ? playIn(data) : null; }); },
      hide: function () { if (!visible) return; visible = false; queue(function () { return shown ? playOut() : null; }); }
    };
  })();
  function bugData(st) {
    var h = st.home || {}, a = st.away || {}, bo = String(st.series || 'BO3').toUpperCase().replace(/^BO\s*/, 'BO ');
    return { stage: String(st.stage || '').toUpperCase(), match: 'MATCH ' + (parseInt(st.match, 10) || 1), bo: bo,
      home: String(h.short || '').toUpperCase(), away: String(a.short || '').toUpperCase(), s1: String(Number(h.score) || 0), s2: String(Number(a.score) || 0),
      timer: st.bugTimer || { running: false, remaining: 0 }, offset: typeof st.serverNow === 'number' ? st.serverNow - Date.now() : 0 };
  }
  window.__lt = { TalentPredict: TalentPredict, CountdownBug: CountdownBug };   /* test hook (headless checks drive it directly) */
  function talentData(st, c) {
    var h = st.home || {}, a = st.away || {}, sc = (Number(h.score) || 0) + (Number(a.score) || 0);
    var names = c.map(function (n, i) { return n || (isPreview ? ['PANEL HOST', 'CASTER 1', 'CASTER 2'][i] : ''); });
    var preds = Array.isArray(st.predictions) ? st.predictions : [];
    return { names: names, preds: [0, 1, 2].map(function (i) { return String(preds[i] || ''); }),
      home: String(h.short || '').toUpperCase(), away: String(a.short || '').toUpperCase(),
      matchLine: 'MATCH ' + (parseInt(st.match, 10) || 1) + ' - GAME ' + (sc + 1) };
  }
  function pollMatch() {
    fetch('/match/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (st) {
      var c = parseCasters(st);
      TalentPredict.setData(talentData(st, c));
      CountdownBug.setData(bugData(st));
      if (c.join('\u0001') === pollMatch.last) return;
      pollMatch.last = c.join('\u0001');
      NameTag.setCasters(c);
    }).catch(function () {});
  }
  pollMatch(); setInterval(pollMatch, 1000);

  /* ═════════ headline text (Dashboard → Dynamic tab → PH Headline) ═════════ */
  var headlineText = '', loaded = false, draft = null;   // draft = headline being typed in the Dynamic tab (preview only)
  function currentText() {
    var t = draft !== null ? draft : headlineText;
    return (t || (isPreview && !loaded ? SAMPLE : '')).toUpperCase();   // sample only if the saved value couldn't be read
  }
  function pollText() {
    fetch('/api/dynamic-content', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var t = String((d && d.match_headline) || '').replace(/\s+/g, ' ').trim();
      loaded = true;
      if (t === headlineText) return;
      headlineText = t;
      if (draft === null) Headline.setText(currentText());                      // only does anything while the headline is on air
    }).catch(function () {});
  }
  var fontsReady = (document.fonts && document.fonts.load) ? document.fonts.load('700 65px "Tandelle"') : Promise.resolve();
  function show() { fontsReady.then(function () { Headline.show(currentText()); }); }
  pollText(); setInterval(pollText, 1000);

  /* ═════════ live control ═════════ */
  /* Control-tab preview (?preview=1) is a MONITOR: it follows the real on-air state like any browser source (the dashboard toggles are
     the only controls) and just fills empty names with samples + mirrors the headline being typed in the Dynamic tab. */
  if (isPreview) {
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'dynamic-draft') return;
      draft = String(e.data.match_headline || '').replace(/\s+/g, ' ').trim();
      Headline.setText(currentText());
    });
  }
  var sse = createOverlaySSE();
  sse.addEventListener('lowerthird', function (e) {
    try {
      var d = JSON.parse(e.data);
      var m = /^nametag([123])$/.exec(d.name);
      if (m) { if (d.action === 'show') NameTag.show(+m[1]); else NameTag.hide(+m[1]); return; }
      if (d.name === 'audiencecomment') {
        if (d.action === 'line') AudienceComment.setRow(d.row);
        else if (d.action === 'show') AudienceComment.show(); else AudienceComment.hide();
        return;
      }
      if (d.name === 'countdownbug') { if (d.action === 'show') CountdownBug.show(); else CountdownBug.hide(); return; }
      if (d.name === 'talentpredict') { if (d.action === 'show') TalentPredict.show(); else TalentPredict.hide(); return; }
      if (d.name !== 'headline') return;
      if (d.action === 'show') show(); else Headline.hide();
    } catch (err) {}
  });
  fetch('/overlay/lowerthird-state', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (s) { if (!s) return; if (s.countdownbug) CountdownBug.show(); if (s.talentpredict) TalentPredict.show(); if (s.headline) show(); [1, 2, 3].forEach(function (n) { if (s['nametag' + n]) NameTag.show(n); }); }).catch(function () {});
  fetch('/api/audience-comment', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (a) {
    if (a && a.active) { AudienceComment.setRow(a.row); AudienceComment.show(); }
  }).catch(function () {});
})();
</script>
