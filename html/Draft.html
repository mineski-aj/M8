<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base href="/">
  <script src="html/js/cache-bust.js"></script>
  <script src="html/js/theme-apply.js"></script>
  <script src="html/js/game-refresh.js"></script>
  <script src="html/js/sponsor-set.js"></script>
  <script src="html/js/event-log-client.js"></script>
  <script src="html/js/overlay-sse-shim.js"></script>
  <title>Draft Overlay</title>
  <style>
    @font-face {
      font-family: 'General Sans';
      font-weight: 600;
      font-display: block;
      src: local('GeneralSans-Semibold'), local('GeneralSans-SemiBold'), local('General Sans Semibold');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 500;
      font-display: block;
      src: local('GeneralSans-Medium'), local('General Sans Medium'), url('/assets/fonts/GeneralSans-Medium.otf') format('opentype');
    }
    @font-face {
      font-family: 'General Sans';
      font-weight: 700;
      font-display: block;
      src: local('GeneralSans-Bold'), local('General Sans Bold'), url('/assets/fonts/GeneralSans-Bold.otf') format('opentype');
    }
    @font-face {
      font-family: 'Anton';
      font-weight: 400;
      font-display: block;
      src: local('Anton'), local('Anton Regular'), url('assets/fonts/Anton-Regular.ttf') format('truetype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    /* ── Scene ─────────────────────────────────────────────────── */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      background: url('assets/overlay/draft/draftbg.png') no-repeat 0 0 / 1920px 1080px;
      transform: translateY(0);
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* JS (see the #scene background-image line further down) always
       overrides this per match state (draftbg.png vs. the Enduring
       Legacy variant) — this is just the pre-JS default so there's no
       flash of the wrong art on first paint. Anniversary has no Enduring
       Legacy variant of its own, so JS always picks this file for that
       theme regardless of matchType. */
    [data-theme="10th_anniversary"] #scene {
      background-image: url('assets/overlay/draft/anniversary/draftbg.png');
    }
    [data-theme="playoffs"] #scene {
      background-image: url('assets/overlay/draft/playoffs/draftbg.png');
    }
    /* Hidden state slides fully below the frame; base rule above carries
       the "in" transition (slides upward to show), this carries the
       "out" transition (slides downward to hide). Default (no class) is
       visible, so a page load never flashes blank while the real state
       is still being fetched — see the restore-on-load fetch below. */
    #scene.draft-hidden {
      transform: translateY(1080px);
      transition: transform 0.45s cubic-bezier(0.4, 0, 1, 1);
    }

    /* ── Status area (BANNING / PICKING / FINAL CHANGES) ────────
       left: -125.889px, top: 660.077px from design CSS.
       Width 2172px makes the visual center land at 960px (screen center).
    ─────────────────────────────────────────────────────────────── */
    #status-area {
      position: absolute;
      left: -125.889px;
      top: 923.077px;
      width: 2172px;
      text-align: center;
    }
    #status-text {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 18px; /* 4.3pt @ 300dpi */
      color: rgb(40,40,40);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    /* ── Countdown row ─────────────────────────────────────────── */
    #countdown-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }
    #countdown-text {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 63px; /* 15.12pt @ 300dpi */
      color: rgb(40,40,40);
      line-height: 1;
    }

    /* ── Camp indicator triangles ──────────────────────────────── */
    .tri {
      width: 14px; height: 14px;
      flex-shrink: 0;
      visibility: hidden; /* reserves space; keeps countdown centered */
      background: #00E878;
      animation: tri-hover 2.2s ease-in-out infinite;
    }
    .tri.active { visibility: visible; }

    /* Camp1 → left-pointing (on left of countdown, points toward camp1 side) */
    #tri-camp1 { clip-path: polygon(14px 0, 0 7px, 14px 14px); }
    /* Camp2 → right-pointing (on right of countdown, points toward camp2 side) */
    #tri-camp2 { clip-path: polygon(0 0, 14px 7px, 0 14px); }

    @keyframes tri-hover {
      0%   { transform: translateX(-4px); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(-4px); }
    }

    /* ── Card idle triangles — shown only before a seat's picking turn
       starts. Anchored right at the card's top/bottom edge; plate-content's
       overflow:hidden clips whichever part of the hover bob exceeds the
       card bounds. Apex always points toward the card's vertical centre. */
    .card-tri {
      position: absolute;
      left: 50%;
      width: 42px; height: 20px;
      pointer-events: none;
      z-index: 2;
      display: none;
      will-change: transform;
    }

    .card-tri-top {
      top: 0;
      /* Matches the animation's 0%/100% keyframe exactly — otherwise, during
         its staggered animation-delay, the element has no transform at all
         (not even the translateX(-50%) centering, since that only exists
         inside the keyframes), so it sits uncentered until the delay ends
         and visibly snaps into place. */
      transform: translateX(-50%) translateY(-3px);
      animation: card-tri-bob-top 2.2s ease-in-out infinite;
    }
    .card-tri-bottom {
      bottom: 0;
      transform: translateX(-50%) translateY(3px);
      animation: card-tri-bob-bottom 2.2s ease-in-out infinite;
    }
    @keyframes card-tri-bob-top {
      0%, 100% { transform: translateX(-50%) translateY(-3px); }
      50%      { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes card-tri-bob-bottom {
      0%, 100% { transform: translateX(-50%) translateY(3px); }
      50%      { transform: translateX(-50%) translateY(7px); }
    }


    /* Glow is baked into a tiny SVG image (rasterized once, then just a
       cached texture riding a compositor-only transform animation). The
       old per-element filter: drop-shadow() + clip-path forced a re-raster
       of every triangle on every bob frame — expensive under vMix's CEF
       off-screen renderer. ::before extends 14px past the 42x20 box so the
       halo isn't cut off; plate-content's overflow:hidden still clips it
       at the card edge exactly as before. */
    .card-tri::before {
      content: ''; position: absolute;
      left: -14px; top: -14px; width: 70px; height: 48px;
      background-repeat: no-repeat; background-size: 100% 100%;
      pointer-events: none;
    }
    .card-tri-top.camp1::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%231E64FF'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%231E64FF'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'14%2C14%2056%2C14%2035%2C34'%20fill%3D'%231E64FF'%20filter%3D'url(%23g)'%2F%3E%3C%2Fsvg%3E"); }
    .card-tri-bottom.camp1::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%231E64FF'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%231E64FF'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'35%2C14%2056%2C34%2014%2C34'%20fill%3D'%231E64FF'%20filter%3D'url(%23g)'%2F%3E%3C%2Fsvg%3E"); }
    .card-tri-top.camp2::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%23FF3232'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%23FF3232'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'14%2C14%2056%2C14%2035%2C34'%20fill%3D'%23FF3232'%20filter%3D'url(%23g)'%2F%3E%3C%2Fsvg%3E"); }
    .card-tri-bottom.camp2::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%23FF3232'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%23FF3232'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'35%2C14%2056%2C34%2014%2C34'%20fill%3D'%23FF3232'%20filter%3D'url(%23g)'%2F%3E%3C%2Fsvg%3E"); }

    /* 10th Anniversary — new camp colors + a 2px stroke that reads as INSIDE
       the triangle's silhouette: the SVG draws the full-size #cdc3d4 triangle
       (with the camp-colored glow) and a second, smaller triangle (vertices
       pulled ~2px inward) in the real camp color on top; the sliver of the
       outer one left visible IS the stroke. */
    [data-theme="10th_anniversary"] .card-tri-top.camp1::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%230095fd'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%230095fd'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'14%2C14%2056%2C14%2035%2C34'%20fill%3D'%23cdc3d4'%20filter%3D'url(%23g)'%2F%3E%3Cpolygon%20points%3D'17%2C15%2053%2C15%2035%2C32'%20fill%3D'%230095fd'%2F%3E%3C%2Fsvg%3E"); }
    [data-theme="10th_anniversary"] .card-tri-bottom.camp1::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%230095fd'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%230095fd'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'35%2C14%2056%2C34%2014%2C34'%20fill%3D'%23cdc3d4'%20filter%3D'url(%23g)'%2F%3E%3Cpolygon%20points%3D'35%2C16%2053%2C33%2017%2C33'%20fill%3D'%230095fd'%2F%3E%3C%2Fsvg%3E"); }
    [data-theme="10th_anniversary"] .card-tri-top.camp2::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%23fe243e'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%23fe243e'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'14%2C14%2056%2C14%2035%2C34'%20fill%3D'%23cdc3d4'%20filter%3D'url(%23g)'%2F%3E%3Cpolygon%20points%3D'17%2C15%2053%2C15%2035%2C32'%20fill%3D'%23fe243e'%2F%3E%3C%2Fsvg%3E"); }
    [data-theme="10th_anniversary"] .card-tri-bottom.camp2::before { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'70'%20height%3D'48'%20viewBox%3D'0%200%2070%2048'%3E%3Cdefs%3E%3Cfilter%20id%3D'g'%20x%3D'0'%20y%3D'0'%20width%3D'100%25'%20height%3D'100%25'%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'1.5'%20result%3D'a'%2F%3E%3CfeGaussianBlur%20in%3D'SourceAlpha'%20stdDeviation%3D'4'%20result%3D'b'%2F%3E%3CfeFlood%20flood-color%3D'%23fe243e'%2F%3E%3CfeComposite%20in2%3D'a'%20operator%3D'in'%20result%3D'ca'%2F%3E%3CfeFlood%20flood-color%3D'%23fe243e'%2F%3E%3CfeComposite%20in2%3D'b'%20operator%3D'in'%20result%3D'cb'%2F%3E%3CfeMerge%3E%3CfeMergeNode%20in%3D'cb'%2F%3E%3CfeMergeNode%20in%3D'ca'%2F%3E%3CfeMergeNode%20in%3D'SourceGraphic'%2F%3E%3C%2FfeMerge%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Cpolygon%20points%3D'35%2C14%2056%2C34%2014%2C34'%20fill%3D'%23cdc3d4'%20filter%3D'url(%23g)'%2F%3E%3Cpolygon%20points%3D'35%2C16%2053%2C33%2017%2C33'%20fill%3D'%23fe243e'%2F%3E%3C%2Fsvg%3E"); }

    /* Playoffs — the idle card triangles are the gold playoffs_trianglesdraft.png
       (61x31, apex down) instead of the glowing SVG triangles. The bottom one
       is the same art flipped vertically so its apex points up. Box resized to
       the art; the bob animation still moves the whole box. */
    [data-theme="playoffs"] .card-tri { width: 61px; height: 31px; }
    [data-theme="playoffs"] .card-tri::before {
      left: 0; top: 0; width: 100%; height: 100%;
      background-image: url('assets/overlay/draft/playoffs/playoffs_trianglesdraft.png');
    }
    [data-theme="playoffs"] .card-tri-bottom::before { transform: scaleY(-1); }

    /* ── Pick plate flex layout ────────────────────────────────── */
    .plates-camp {
      position: absolute;
      top: 851px;
      display: flex;
      gap: 1px;
      align-items: flex-start;
    }
    .plates-camp-1 { left: 0; }
    /* Camp2: seat_1 rightmost → row-reverse, container starts at left:1161 */
    .plates-camp-2 { left: 1161px; flex-direction: row-reverse; }

    /* Flex item — its width transitions drive the squeeze/expand */
    .seat-unit {
      flex: 0 0 auto;
      width: 151px;
      height: 168px;
      position: relative;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }
    .seat-unit.picking-expand { width: 167px; }

    /* 1 picker: others shrink to 147 px */
    .plates-camp.has-picker .seat-unit:not(.picking-expand) { width: 147px; }

    /* 2 pickers: others shrink to fill remaining span exactly */
    .plates-camp.has-two-pickers .seat-unit.picking-expand  { width: 167px; }
    .plates-camp.has-two-pickers .seat-unit:not(.picking-expand) {
      width: calc((759px - 2 * 167px - 4px) / 3); /* ≈ 140.33 px */
    }

    /* Plate — fills the seat-unit so plateback.png background grows with it */
    .plate {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      background: url('assets/overlay/draft/plateback.png') no-repeat center center / cover;
    }
    /* 10th Anniversary — separate blue-side/red-side plate art (regular
       theme uses the same plateback.png for both sides). .plates-camp-1
       is blue (campid 1), .plates-camp-2 is red (campid 2) — see
       buildPickPlates/showPickAnim below for the same split applied to
       hero banners and the picking*.webm animations. */
    [data-theme="10th_anniversary"] .plates-camp-1 .plate {
      background-image: url('assets/overlay/draft/anniversary/plateback1.png');
    }
    [data-theme="10th_anniversary"] .plates-camp-2 .plate {
      background-image: url('assets/overlay/draft/anniversary/plateback2.png');
    }

    /* Playoffs — gold plate back for both sides. */
    [data-theme="playoffs"] .plate {
      background-image: url('assets/overlay/draft/playoffs/playoffs_draftgold.png');
    }

    /* Content wrapper — fills the plate width so cropping scales with it */
    .plate-content {
      position: absolute;
      top: 0; left: 0; right: 0; height: 168px;
      overflow: hidden;
    }

    /* Hero WebM video — 168 px wide (uniform scale), centred.
       plate-content overflow:hidden crops sides as plate shrinks,
       and crops top/bottom since the video is taller than 168 px. */
    .hero-video {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      height: auto;
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Matte-reveal canvas — matches hero-video position exactly */
    .plate-canvas {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      /* height set dynamically to match hero video natural aspect ratio */
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Name — centred under the seat-unit (auto width = seat-unit width) */
    .player-name {
      position: absolute;
      top: 177px; /* 168 + 9 */
      left: 0; right: 0;
      text-align: center;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }


    /* Pick plate reveal flash (kept for reference, not triggered) */
    @keyframes reveal-blue {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(30,120,255,1),
                         0 0 36px 18px rgba(30,120,255,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(30,120,255,0.6),
                         0 0 18px 8px rgba(30,120,255,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes reveal-red {
      0%   { box-shadow: none; }
      16%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      32%  { box-shadow: none; }
      48%  { box-shadow: inset 0 0 0 4px rgba(255,50,50,1),
                         0 0 36px 18px rgba(255,50,50,0.95); }
      64%  { box-shadow: none; }
      80%  { box-shadow: inset 0 0 0 3px rgba(255,50,50,0.6),
                         0 0 18px 8px rgba(255,50,50,0.4); }
      100% { box-shadow: none; }
    }
    @keyframes hero-fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .plate.revealing-blue { animation: reveal-blue 0.72s ease-in-out forwards; }
    .plate.revealing-red  { animation: reveal-red  0.72s ease-in-out forwards; }
    .plate-hero.fadein    { animation: hero-fadein 0.45s ease-in forwards; }

    /* ── Hero banner (bluehero / redhero) ──────────────────────── */
    .hero-banner {
      position: absolute;
      top: 0;
      width: 27px; height: 202px;
      pointer-events: none;
      z-index: 4;
      transition: transform 0.3s ease-out;
    }
    .hero-banner-c1 { left:  0; transform: translateX(-100%); }
    .hero-banner-c2 { right: 0; transform: translateX(100%);  }
    .hero-banner-c1.slide-in { transform: translateX(0); }
    .hero-banner-c2.slide-in { transform: translateX(0); }

    .hero-banner-img {
      position: absolute;
      top: 0; left: 0;
      width: 27px; height: 202px;
      display: block;
    }
    .hero-banner-name {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      writing-mode: vertical-lr;
      text-orientation: mixed;
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 600;
      font-size: 15.4px; /* 3.69pt @ 300dpi */
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Draft Stats (toggleable) — PICK / CONTENTION RATE / WIN RATE
       reveal, played once per live hero pick, both sides (blue rect for
       camp1, red for camp2 — see .dstats-rect-camp1/2 below).
       Sits inside plate-content so it tracks the seat's own width; fills
       the whole card like every other reveal layer here.

       .dstats-rect and .dstats-text are SEPARATE siblings (not one nested
       inside the other) even though they slide together — this matters:
       mix-blend-mode only blends an element with whatever is already
       painted behind it within the nearest ancestor that itself forms a
       stacking context (transform/opacity/filter/etc. all do this). If
       .dstats-rect were nested inside a wrapper that had its own
       `transform` (needed for the slide), that wrapper would isolate the
       rect's blend to just its own empty background instead of reaching
       through to heroVid — which is exactly the "multiply isn't doing
       anything" bug this shipped with once. Putting the transform on
       .dstats-rect itself (a leaf, no transformed ancestor above it
       besides plate-content, which has none) keeps it blending correctly
       against heroVid; .dstats-text carries the identical slide via the
       shared .dstats-slide rules so the two visually move as one unit. */
    .dstats-slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateX(-100%);
    }
    /* Camp2 (red side) starts off-screen to the RIGHT instead of the left
       — mirror of camp1. Both .dstatsRect and .dstatsText carry a shared
       dstats-campN class specifically so this selector's specificity
       (exactly 2 classes: .dstats-slide + .dstats-campN) matches BOTH
       elements identically — using each element's OWN differently-named
       class here (.dstats-rect-campN vs .dstats-text) instead shipped a
       real bug: .dstats-text.dstats-campN.dstats-slide is a 3-class
       selector, which unconditionally beat the 2-class .dstats-slide.dstats-in
       below regardless of source order, so the text layer stayed stuck
       off-screen forever while the rect (correctly a 2-class tie, resolved
       by ordering this block first) slid in fine — Draft Stats visually
       looked like "just an empty rectangle slides in" for the whole red
       side. This rule MUST stay before .dstats-slide.dstats-in: both are
       genuine 2-class ties on a (camp2, mid-transition-in) element, and
       .dstats-in needs to win that tie so "in" resolves to translateX(0)
       for both camps. The .dstats-out override further below is a 3-class
       selector on purpose (dstats-campN + dstats-slide + dstats-out) so it
       always wins on real specificity — no ordering constraint needed
       there, but it's written with .dstats-campN too for consistency. */
    .dstats-slide.dstats-camp2 {
      transform: translateX(100%);
    }
    .dstats-slide.dstats-in {
      transform: translateX(0);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dstats-slide.dstats-out {
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 1, 1);
    }
    .dstats-slide.dstats-camp2.dstats-out {
      transform: translateX(100%);
    }
    .dstats-rect {
      z-index: 2;
      mix-blend-mode: multiply;
    }
    .dstats-rect-camp1 { background: #0055ff; }
    .dstats-rect-camp2 { background: #cd0000; }
    /* 10th Anniversary — new multiply colors (mix-blend-mode: multiply
       is set on .dstats-rect above, unchanged). */
    [data-theme="10th_anniversary"] .dstats-rect-camp1 { background: #0195fc; }
    [data-theme="10th_anniversary"] .dstats-rect-camp2 { background: #ff243e; }
    /* Playoffs — gradient map instead of a multiply: the rect becomes a
       transparent panel whose backdrop-filter maps the hero's luminance onto
       dark brown -> gold (#po-gradmap, defined at the top of <body>). */
    [data-theme="playoffs"] .dstats-rect-camp1,
    [data-theme="playoffs"] .dstats-rect-camp2 {
      background: transparent;
      mix-blend-mode: normal;
      -webkit-backdrop-filter: url(#po-gradmap);
      backdrop-filter: url(#po-gradmap);
    }
    .dstats-text {
      z-index: 3;
    }
    /* Playoffs out animation: the text just fades while the gold gradient
       map wipes away through picking_reveal's matte (see dstatsPoOut). */
    [data-theme="playoffs"] .dstats-slide.dstats-in { transition: none; }
    .dstats-text.dstats-po-fade { opacity: 0; transition: opacity 0.25s ease-out; }
    /* Canvas that stands in for the backdrop-filter rect during the wipe. */
    .dstats-po-canvas {
      position: absolute;
      left: 50%; top: -3px;
      transform: translateX(-50%);
      width: 168px;
      z-index: 2;
      pointer-events: none;
    }

    /* Rows sit inset from one edge to clear the vertical hero-name
       backer (27px wide, .hero-banner) — camp1's sits at the card's left
       edge so rows shift right to clear it; camp2's sits at the right
       edge (mirrored, for whenever this gets wired up on that side too)
       so rows shift left instead. left/right both set with no explicit
       width lets the box narrow itself automatically. */
    .dstats-text.dstats-camp1 .dstats-row,
    .dstats-text.dstats-camp1 .dstats-debut-row { left: 27px; right: 0; }
    .dstats-text.dstats-camp2 .dstats-row,
    .dstats-text.dstats-camp2 .dstats-debut-row { left: 0; right: 27px; }

    /* Three stacked rows, each independently faded/slid — see
       startDraftStats() below for the exact timeline. Every row shares
       the same untriggered "start" transform (the CONTENTION RATE row's
       own resting spot — where PICK first pops in during phase 2), so
       PICK/WIN RATE visually reveal themselves moving away from the spot
       CONTENTION RATE already occupies when phase 3 fires. */
    .dstats-row {
      position: absolute;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease-out, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dstats-row-pick       { top: 10px;  transform: translateY(54px);  }
    .dstats-row-contention { top: 54px;  transform: translateY(0);     }
    .dstats-row-winrate    { top: 112px; transform: translateY(-58px); }
    .dstats-row.dstats-pop    { opacity: 1; }
    .dstats-row.dstats-settle { transform: translateY(0); }

    /* PICK pops in oversized (phase 2) then shrinks back to normal size
       as it shifts up into its final row (phase 3) — same translateY+scale
       transform, so both read as one continuous motion. Only the pick row
       gets this; contention/win rate just fade+slide, no scale. */
    .dstats-row-pick.dstats-pop    { transform: translateY(54px) scale(2.6); }
    .dstats-row-pick.dstats-settle { transform: translateY(0) scale(1); }

    .dstats-label {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .dstats-value {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 26px;
      color: #fff;
      line-height: 1;
      margin-top: 2px;
    }

    /* Debut Pick — replaces the whole PICK/CONTENTION RATE/WIN RATE
       reveal when the hero's pick count is 0 (never picked before, so
       there's no stat worth showing yet). Still rides on the same phase 1
       rect slide-in; "DEBUT" pops in first, "PICK!" pops in right after,
       each with its own bouncy "button" pop — no phase 3 (nothing to
       settle into), straight to the hold once both are in. */
    .dstats-debut-row {
      position: absolute;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.25s ease-out, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dstats-debut-row.dstats-pop { opacity: 1; transform: scale(1); }
    .dstats-row-debut-label { top: 50px; }
    .dstats-row-debut-value { top: 78px; }
    .dstats-debut-label {
      font-family: 'General Sans', 'Arial Black', sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }
    .dstats-debut-value {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 48px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Patch buff/nerf/adjust badge — pops in once the whole Draft Stats
       container has fully slid back out (see startDraftStats()'s final
       timer). Corner position is mirrored per camp so it never sits under
       that camp's own hero-name banner (camp1's banner is at the card's
       left edge, so the badge sits top-right; camp2's banner is at the
       right edge, so the badge sits top-left instead). */
    .dstats-buff-badge {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5; /* above the hero-banner (4) — it's a corner overlay, meant to sit on top */
      pointer-events: none;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.2s ease-out, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dstats-buff-badge.dstats-pop { opacity: 1; transform: scale(1); }
    .dstats-buff-camp1 { top: 3px; right: 3px; }
    .dstats-buff-camp2 { top: 3px; left: 3px; }
    .dstats-buff-nerf   { background: #e8121f; }
    .dstats-buff-buff   { background: #1fbf4c; }
    .dstats-buff-adjust { background: #0055ff; }

    /* Solid triangle, built the same clip-path way as .card-tri above. */
    .dstats-buff-arrow {
      width: 12px; height: 12px;
      background: #fff;
    }
    .dstats-buff-arrow-down { clip-path: polygon(50% 100%, 0 20%, 100% 20%); }
    .dstats-buff-arrow-up   { clip-path: polygon(50% 0%, 0 80%, 100% 80%); }

    .dstats-buff-gear { width: 15px; height: 15px; color: #fff; }
    .dstats-buff-gear svg { width: 100%; height: 100%; display: block; }

    /* ── Post-pick glow overlay (div above canvas, z-index 3) ──── */
    .plate-glow {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    /* The inset glow is a STATIC box-shadow on a pseudo-element whose
       OPACITY is animated — animating box-shadow itself repaints the layer
       every frame (CPU raster, costly under vMix's CEF), opacity is a
       compositor-only property. Visually the same fade in/out. */
    .plate-glow::before {
      content: ''; position: absolute; inset: 0;
      opacity: 0; pointer-events: none;
      box-shadow: inset 0 0 0 3px rgba(255,215,80,1),
                  inset 0 0 50px 20px rgba(255,200,60,0.75);
    }
    @keyframes picked-glow-gold {
      0%   { opacity: 0; }
      25%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .plate-glow.picked::before { animation: picked-glow-gold 0.9s ease-out forwards; }

    @keyframes hero-brighten {
      0%   { filter: brightness(1); }
      25%  { filter: brightness(2); }
      100% { filter: brightness(1); }
    }
    .hero-video.brightening   { animation: hero-brighten 0.9s ease-out forwards; }
    .plate-canvas.brightening { animation: hero-brighten 0.9s ease-out forwards; }

    /* ── Role icons ────────────────────────────────────────────── */
    /* Anchored at left:5 top:5; default transform centres it in the plate.
       (151-70)/2 - 5 = 35.5   (168-70)/2 - 5 = 44                        */
    .role-icon {
      position: absolute;
      width: 70px; height: 70px;
      /* always centred regardless of plate-content width */
      left: calc(50% - 35px); top: calc(50% - 35px);
      object-fit: contain;
      transform-origin: center;
      transform: scale(1);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      pointer-events: none;
      z-index: 2;
      filter: brightness(0) invert(1) brightness(0.086);
    }
    /* 10th Anniversary — pure white instead of the near-black Regular
       tone (same brightness(0) invert(1) base, just without the final
       brightness(0.086) dimming step). */
    [data-theme="10th_anniversary"] .role-icon {
      filter: brightness(0) invert(1);
    }
    /* Playoffs — #121212 (18/255 = 0.0706 after the black->white base). */
    [data-theme="playoffs"] .role-icon {
      filter: brightness(0) invert(1) brightness(0.0706);
    }

    /* Press squishes from centre — translate calculated in JS at animationend */
    @keyframes role-press {
      0%   { transform: scale(1);    }
      35%  { transform: scale(0.78); }
      65%  { transform: scale(1.10); }
      100% { transform: scale(1);    }
    }
    .role-icon.pressing {
      animation: role-press 0.55s ease-out forwards;
      transition: none;
    }

    /* ── Ban plates ────────────────────────────────────────────── */
    /* overflow:hidden clips the hero tween to the banplate area.
       The element's own box-shadow (outer glow) is NOT clipped by
       its own overflow:hidden — it renders outside the bounds. */
    .banplate {
      position: absolute;
      width: 91px; height: 71px;
      overflow: hidden;
    }

    /* Inset border on top of hero via ::after (same size → no overflow clipping) */
    .banplate::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Red glow when banning — inset only, slow pulse. Static shadow +
       animated opacity (compositor-only) instead of animating box-shadow. */
    @keyframes ban-inner {
      0%, 100% { opacity: 0; }
      50%      { opacity: 1; }
    }
    .banplate.banning::after {
      box-shadow: inset 0 0 0 3px rgba(255,50,50,1),
                  inset 0 0 14px 3px rgba(255,50,50,0.55);
      opacity: 0;
      animation: ban-inner 1.8s ease-in-out infinite;
    }

    /* Playoffs — empty ban slots show playoffs_bandrafticon.png (44x45). It is
       NOT allowed to sit over a banned hero, so it fades out as the hero is
       revealed (see updateBanSeat). Only built under the playoffs theme. */
    .ban-icon {
      position: absolute; left: 23.5px; top: 13px; width: 44px; height: 45px;
      pointer-events: none; z-index: 1;
      opacity: 1; transition: opacity 250ms ease;
    }
    .ban-icon.ban-icon-off { opacity: 0; }

    /* Ban hero image */
    .ban-hero {
      width: 91px; height: 71px;
      object-fit: cover; display: block;
      opacity: 0;
    }

    /* Ban reveal: slides up from below (masked by overflow:hidden),
       then fades to greyscale + 50% brightness */
    @keyframes ban-reveal {
      0%   { transform: translateY(71px); filter: none; }
      55%  { transform: translateY(0);    filter: none; }
      100% { transform: translateY(0);    filter: grayscale(1) brightness(0.5); }
    }
    .ban-hero.ban-revealing { animation: ban-reveal 0.95s ease-out forwards; }

    /* ── Pick gradient overlay ─────────────────────────────────── */
    .pick-gradient {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: none;
      z-index: 2; /* must render over the player photo (z-index: 1) */
      animation: grad-pulse 1.4s ease-in-out infinite;
      /* screen (not normal) blending — lightens/brightens the photo
         underneath by its own color instead of just tinting over it, so it
         reads as the photo glowing rather than being covered by a wash */
      mix-blend-mode: screen;
    }
    .pick-gradient.camp1 {
      background: linear-gradient(to top, rgba(30,100,255,0.85) 0%, transparent 70%);
    }
    .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(255,50,50,0.85) 0%, transparent 70%);
    }
    /* 10th Anniversary — same orange glow for both sides instead of the
       camp-colored blue/red split. */
    [data-theme="10th_anniversary"] .pick-gradient.camp1,
    [data-theme="10th_anniversary"] .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(255,163,68,0.85) 0%, transparent 70%);
    }
    /* Playoffs — gold glow for both sides. */
    [data-theme="playoffs"] .pick-gradient.camp1,
    [data-theme="playoffs"] .pick-gradient.camp2 {
      background: linear-gradient(to top, rgba(237,197,85,0.85) 0%, transparent 70%);
    }
    @keyframes grad-pulse {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.9;  }
    }

    /* ── Player photo (FRONT → VICTORY sequence during picking) ──── */
    .player-photo {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%) translateY(30px);
      width: 333px; /* 168px card frame × 2.2, scaled down 10% */
      height: auto;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      display: none;
    }
    @keyframes photo-ease-up-in {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes photo-quick-fadeout {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    @keyframes photo-bounce-in {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
      60%  { opacity: 1; transform: translateX(-50%) scale(1.06); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .player-photo.photo-entering  { animation: photo-ease-up-in     0.6s  cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .player-photo.photo-quick-out { animation: photo-quick-fadeout  0.15s ease-in forwards; }
    .player-photo.photo-bounce-in { animation: photo-bounce-in      0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* FRONT renders visually larger than VICTORY at the same box width
       (source-image framing), so FRONT gets an extra 10% reduction */
    .player-photo.photo-front-size { width: 300px; }

    /* Erase canvas — mirrors player-photo positioning; driven by the same
       matte mask (s17_matte2.webm) that reveals the hero video */
    .photo-canvas {
      position: absolute;
      left: 50%; top: 7px;
      transform: translateX(-50%);
      width: 333px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Pick background video + matte canvas (inside each plate) ── */
    .plate { overflow: hidden; }

    .plate-pick-video {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      display: none;
      pointer-events: none;
      z-index: 0;
    }

    /* Layers on top of .plate-pick-video (later in the same untiered
       stacking group — see DOM order in buildPickPlates), but still under
       the player photo, which has an explicit z-index. */
    [data-theme="playoffs"] .plate-pick-video { display: none !important; }
    .plate-pick-anim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .plate-pick-anim.pick-anim-visible { opacity: 1; }
    /* 10th Anniversary — pickingblue/red.webm's black background was never
       transparent (no alpha channel in the source file, Regular included —
       this isn't something the white recolor introduced), it just read as
       fine against Regular's own bluepickbg1/redpickbg1 loop. Against the
       brighter anniversary ambient loop it reads as a solid black box
       covering it. mix-blend-mode: screen fixes this the same way it's
       already used elsewhere in this file for a video-over-video overlay
       (see the photo-glow comment above): black contributes nothing to
       the blend (so the ambient loop shows straight through), only the

<body>
<!-- Playoffs Draft Stats gradient map (see .dstats-rect under [data-theme="playoffs"]):
     luminance of whatever is behind the rect -> dark brown / mid gold / light gold. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="po-gradmap" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.15 0.47 0.82"/>
      <feFuncG type="table" tableValues="0.11 0.36 0.68"/>
      <feFuncB type="table" tableValues="0.03 0.12 0.31"/>
    </feComponentTransfer>
  </filter>
</svg>

<div id="scene"></div>

<script>
(function () {
  'use strict';

  /* Dashboard Control-tab preview iframe loads this page with ?preview=1
     (same convention as the Edit tab and mplfs.html-style previewButton
     entries). When set, this instance is fully decoupled from the REAL
     broadcast show/hide state — it never auto-shows/hides itself based on
     what's actually live, only in response to window.previewTrigger(...)
     calls the dashboard makes directly. Without this, a preview iframe
     would react to the same live SSE events as the real vMix instance,
     doubling video-decode/canvas-compositing load exactly when this scene
     is heaviest (see CLAUDE.md-adjacent perf notes on this page). */
  var PREVIEW_ONLY = /[?&]preview=1(?:&|$)/.test(window.location.search);

  /* 10th Anniversary reskin — draftbg.png, bluehero/redhero.png, and the
     picking*.webm animations (recolored white; plateback swap is CSS-only,
     see .plates-camp-1/-2 .plate below) all have anniversary/ variants. */
  /* Playoffs picking art (opaque white "PICKING" loop, both sides) + its own
     reveal matte (luma runs black→white, so its baked alpha = luma — the
     opposite polarity of s17_matte2). Read at plate-build time. */
  function isPlayoffsDraft() {
    return document.documentElement.getAttribute('data-theme') === 'playoffs';
  }
  function isAnniversaryTheme() {
    return document.documentElement.getAttribute('data-theme') === '10th_anniversary';
  }

  /* Star match backgrounds (Epic Rivalry, Enduring Legacy, etc. — see
     html/match-dashboard.html's MATCH_TYPES for the full label list) —
     same suffix convention as the asset filenames on disk
     (assets/overlay/draft/draftbg_<SUFFIX>.png / assets/overlay/draft/anniversary/
     draftbg_<SUFFIX>.png). Not every matchType has art in every theme
     (or at all yet) — resolved at runtime via Image() preload (this is a
     CSS background-image, not an <img>, so onerror isn't usable directly)
     rather than a hardcoded whitelist, so a newly-dropped-in asset just
     works with no code change, and a missing one silently falls back to
     the plain themed background instead of a broken image. */
  var STAR_MATCH_SUFFIX = {
    epic: 'EPIC RIVALRY', international: 'INTERNATIONAL RIVALRY',
    golden: 'GOLDEN RIVALRY', clash: 'CLASH OF TITANS', enduring: 'ENDURING LEGACY',
  };
  /* 10th Anniversary's golden/clash art is hyphen-named on disk
     (draftbg_GOLDEN-RIVALRY.png); Regular keeps the spaced convention. */
  var STAR_MATCH_SUFFIX_ANNIV = {
    golden: 'GOLDEN-RIVALRY', clash: 'CLASH-OF-TITANS',
  };
  function starSuffixFor(matchType) {
    if (isAnniversaryTheme() && STAR_MATCH_SUFFIX_ANNIV[matchType]) return STAR_MATCH_SUFFIX_ANNIV[matchType];
    /* Playoffs: Golden Rivalry art is hyphen-named too (assets/overlay/draft/playoffs/draftbg_GOLDEN-RIVALRY.png) */
    if (document.documentElement.getAttribute('data-theme') === 'playoffs' && matchType === 'golden') return STAR_MATCH_SUFFIX_ANNIV.golden;
    return STAR_MATCH_SUFFIX[matchType];
  }
  function setBgWithFallback(el, primaryUrl, fallbackUrl) {
    if (!el) return;
    if (primaryUrl === fallbackUrl) { el.style.backgroundImage = "url('" + fallbackUrl + "')"; return; }
    var probe = new Image();
    probe.onload  = function () { el.style.backgroundImage = "url('" + primaryUrl + "')"; };
    probe.onerror = function () { el.style.backgroundImage = "url('" + fallbackUrl + "')"; };
    probe.src = primaryUrl;
  }

  /* Game feed: the server's cached + normalised copy of the Game API (built-in Dire API in LIVE/DEBUG mode ->
     /dire/api/gamedata, already in the enriched seat_1..5 shape) — never the upstream URL. Pick/ban state comes
     straight from it: data.state / state_left_time / banpick_paused, camp_list[].ban_hero_list and per seat
     heroid / ban_heroid / picking / banning / ban_order / pick_order. Polled with GameRefresh.loop (see startPolling). */
  var GAME_FEED_URL = '/api/gamedata-proxy';

  /* Player photo names (basenames with both FRONT + VICTORY variants). */
  var PLAYER_PHOTO_NAMES  = [];
  var PLAYER_PHOTO_LOOKUP = {}; /* lowercased name → canonical name */
  fetch('/api/player-photos', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      PLAYER_PHOTO_NAMES = d.names || [];
      PLAYER_PHOTO_NAMES.forEach(function(n) { PLAYER_PHOTO_LOOKUP[n.toLowerCase()] = n; });
    })
    .catch(function(){});

  /* 'live' = match the seat's real player name to a photo; 'random' = test mode.
     Server defaults to 'live' on every restart; dashboard can flip it at runtime. */
  var draftPhotoMode = 'live';
  fetch('/overlay/draft-photo-mode', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d.mode) draftPhotoMode = d.mode; })
    .catch(function(){});

  /* Draft Stats / Draft Recap / Draft Predict were driven by external APIs (draft-info-only, previous-draft, predictions) that
     the built-in Dire API doesn't provide — dropped. draftStatsEnabled stays false (see its declaration). */

  /* Player photo layout — matches .player-photo / .photo-canvas CSS width */
  var PHOTO_W = 333;

  /* Pick plate layout */
  var PLATE_W = 151, PLATE_H = 168, PLATE_TOP = 851, PLATE_GAP = 1;
  var NAME_TOP = 1028;
  /* role string → icon filename */
  var ROLE_MAP = {
    'exp_laner':  'assets/game/role/EXP LANER.png',
    'jungler':    'assets/game/role/JUNGLER.png',
    'mid_laner':  'assets/game/role/MID LANER.png',
    'roamer':     'assets/game/role/ROAMER.png',
    'gold_laner': 'assets/game/role/GOLD LANER.png',
  };
  /* ordered list — seat index fallback when all roles missing */
  var ALL_ROLES = ['exp_laner', 'jungler', 'mid_laner', 'roamer', 'gold_laner'];
  /* ROLE_FILES[i] used only as initial placeholder before first poll */
  var ROLE_FILES = ALL_ROLES.map(function(r) { return ROLE_MAP[r]; });

  /* Lane icon per seat: the feed's seat order IS the lane order (seat_1 EXP, 2 JUNGLE, 3 MID, 4 ROAM, 5 GOLD — lib/dire.js
     roster / rawAdapter.resolveRoles), so the role comes from seat.role when it is a known lane, else from the seat index. */
  var ROLE_ALIASES = {
    'exp_laner': 'exp_laner', 'exp': 'exp_laner', 'exp laner': 'exp_laner',
    'jungler': 'jungler', 'jungle': 'jungler',
    'mid_laner': 'mid_laner', 'mid': 'mid_laner', 'mid laner': 'mid_laner',
    'roamer': 'roamer', 'roam': 'roamer', 'support': 'roamer',
    'gold_laner': 'gold_laner', 'gold': 'gold_laner', 'gold laner': 'gold_laner', 'marksman': 'gold_laner'
  };
  function seatRole(seat, seatIdx) {
    return ROLE_ALIASES[String((seat && seat.role) || '').toLowerCase().trim()] || ALL_ROLES[seatIdx] || null;
  }

  /* Ban plate layout — no gap between seats */
  var BAN_W = 91, BAN_H = 71, BAN_TOP = 780;
  var C1_BAN_X = [0,1,2,3,4].map(function(i){ return 304 + i * BAN_W; });
  var C2_BAN_X = [0,1,2,3,4].map(function(i){ return 1525 - i * BAN_W; });

  /* ── DOM refs ──────────────────────────────────────────────── */
  var scene    = document.getElementById('scene');


  /* ── Timer bar (smooth rAF countdown) ─────────────────────── */
  var TIMER_MAX    = 50;   /* max seconds per pick/ban turn */
  var timerEl      = null;
  var tmSyncAt     = 0;    /* performance.now() when this turn's value was locked in */
  var tmSyncVal    = 0;    /* leftTime locked in at the start of this turn */
  var tmCampid     = 0;    /* 0 = hidden, 1/2 = active camp */
  var tmRAF        = null;
  var tmHasStart   = false; /* true once first value is locked for the current turn */

  function tmGetCurrent() {
    return Math.max(0, tmSyncVal - (performance.now() - tmSyncAt) / 1000);
  }

  function tmFrame() {
    var t     = tmGetCurrent();
    var scale = Math.min(1, Math.max(0, t / TIMER_MAX));
    timerEl.style.transform = 'scaleX(' + scale + ')';
    if (t > 0) {
      tmRAF = requestAnimationFrame(tmFrame);
    } else {
      tmRAF = null;
      tmHasStart = false; /* unlock so the next non-zero value starts a fresh turn */
    }
  }

  function tmSync(campid, leftTime) {
    if (!timerEl) return;
    if (campid === 0 || leftTime <= 0) {
      timerEl.style.display = 'none';
      if (tmRAF) { cancelAnimationFrame(tmRAF); tmRAF = null; }
      tmCampid   = 0;
      tmHasStart = false;
      return;
    }
    /* 10th Anniversary keeps its one gradient regardless of which camp is
       picking (see [data-theme="10th_anniversary"] #timer-bar CSS) — clear
       any inline override so that CSS rule can actually apply; Regular
       keeps the existing camp-colored flat fill. */
    timerEl.style.background = (isAnniversaryTheme() || document.documentElement.getAttribute('data-theme') === 'playoffs')
      ? ''
      : (campid === 1 ? 'rgb(0,80,220)' : 'rgb(220,50,50)');
    timerEl.style.display    = 'block';

    /* Decide if this is a genuinely new turn:
       - camp switched sides, OR
       - no starting value locked yet for this turn, OR
       - API reports significantly MORE time than our prediction (timer reset for new phase) */
    var predicted = tmGetCurrent();
    var isNewTurn = (campid !== tmCampid) || !tmHasStart || (leftTime > predicted + 5);

    if (isNewTurn) {
      tmSyncAt   = performance.now();
      tmSyncVal  = leftTime;
      tmCampid   = campid;
      tmHasStart = true;
      if (!tmRAF) tmRAF = requestAnimationFrame(tmFrame);
    }
    /* Otherwise: client countdown runs uninterrupted — API inconsistencies ignored */
  }

  function buildTimerBar() {
    timerEl = document.createElement('div');
    timerEl.id = 'timer-bar';
    scene.appendChild(timerEl);
  }


  /* ── Element / state maps ──────────────────────────────────── */
  var campContainers = {}; /* campid → flex container div */
  var pickEls  = {};
  var prevPick = {};
  var banEls   = {};  /* campid_i → { banplate, bhi } */
  var prevBan  = {};  /* campid_i → { ban_heroid, banning } */
  var teamEls  = {};  /* campid → div */
  var logoEls  = {};  /* campid → { img, fb } */

      campContainers[campid] = container;

      for (var i = 0; i < 5; i++) {
        var key = campid + '_' + i;

        /* Seat unit — the flex item whose width transitions */
        var seatUnit = document.createElement('div');
        seatUnit.className = 'seat-unit';

        /* Plate — always 151 px; edge seats anchor inward so they only expand toward centre */
        var plate = document.createElement('div');
        plate.id = 'plate-' + key;
        /* Expansion direction per seat:
           Camp1: seat1→right, seat2→left, seat3→right, seat4→left, seat5→left
           Camp2: TBD */
        var C1_ANCHORS = ['anchor-left','anchor-right','anchor-left','anchor-right','anchor-right'];
        var anchor = '';
        if (campid === 1) { anchor = C1_ANCHORS[i]; }
        else              { if (i === 0) anchor = 'anchor-right'; else if (i === 4) anchor = 'anchor-left'; }
        plate.className = 'plate' + (anchor ? ' ' + anchor : '');

        /* Content wrapper — 151 px fixed, clipped, anchored inside the expanding plate */
        var plateContent = document.createElement('div');
        plateContent.className = 'plate-content';

        var vid = document.createElement('video');
        vid.className   = 'plate-pick-video';
        /* Playoffs: no blue/red pick loop at all — the gold plate back +

        if (!isPlayoffsDraft()) vid.src = isAnniversaryTheme()

        var pickGrad = document.createElement('div');

        /* New picking animation — layered on top of the original pick

        var heroVid = document.createElement('video');

        /* Canvas for matte composite — on top of heroVid during reveal.

        var heroMatteVid = document.createElement('video');

        var triCampClass = campid === 1 ? 'camp1' : 'camp2';

        dstatsText.appendChild(dstatsWinrateRow);

        plate.appendChild(plateContent);

        /* Player name sits below, centred in the seat-unit */
        var nameEl = document.createElement('div');
        nameEl.className = 'player-name';
        nameEl.id = 'name-' + key;

        seatUnit.appendChild(plate);
        seatUnit.appendChild(nameEl);
        container.appendChild(seatUnit);

        pickEls[key] = {
          key: key, campid: campid,
          seatUnit: seatUnit, plate: plate, pickVid: vid, pickAnim: pickAnim,

  function pollMatchState() {
    fetch('/match/state', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(s) {
        var maxWins = Math.ceil(parseInt((s.series || 'BO3').replace('BO', '')) / 2);
        var home    = s.home || s.teamA;
        var away    = s.away || s.teamB;
        var swapped = s.swapped !== undefined ? s.swapped : (s.blueTeam === 'B');
        var c1Team  = swapped ? away : home;
        var c2Team  = swapped ? home : away;
        renderBars(scoreEls[1], maxWins, c1Team.score, true);
        renderBars(scoreEls[2], maxWins, c2Team.score, false);

        /* Match number is the manually-set /match/state field; game number
           is derived the same way Match Board's computeGame() does —
           total games played so far (both scores) + 1. */
        var matchNum = s.match || 1;
        var gameNum  = (home.score || 0) + (away.score || 0) + 1;
        var mgTxt = document.querySelector('#draft-match-game .draft-match-game-text');
        if (mgTxt) mgTxt.textContent = matchLabelFor(matchNum, s) + ' - GAME ' + gameNum;

        /* dcoachSwapped feeds pollCoachBpm()'s coach_home1/coach_away1 pairing. Coach NAME/headset: the game feed has
           no coach field, so they come from Match Board's manual coach entry (home/away.coach), already resolved to
           the left (blue/camp1) and right (red/camp2) side by the swap above. */
        dcoachSwapped = swapped;
        updateCoachFromDraft('home', c1Team.coach);
        updateCoachFromDraft('away', c2Team.coach);

        /* Map bug — same source as the ingame scoreboard's #sb-map.
           'NONE' is an explicit Match Board dropdown choice (match-
           dashboard.html's #map-select) meaning "no map configured" —
           checked before the 'Broken Walls' fallback below, which
           exists only for "field not set yet", not "deliberately
           cleared". Applies under every theme. */
        var mapBoxEl = document.getElementById('draft-map');
        if (s.map === 'NONE') {
          if (mapBoxEl) mapBoxEl.style.display = 'none';
          mapDetailCurrentMap = null;
        } else {
          if (mapBoxEl) mapBoxEl.style.display = '';
          var mapVal     = s.map || 'Flying Cloud';
          mapDetailCurrentMap = mapVal;
          var mapNameTxt = document.querySelector('#draft-map-name .draft-map-name-text');
          var mapLogoImg = document.getElementById('draft-map-logo-img');
          if (mapNameTxt) {
            mapNameTxt.textContent = mapVal.toUpperCase();
            draftFitText(mapNameTxt, 228, 36);
          }
          if (mapLogoImg && mapLogoImg.dataset.map !== mapVal) {
            mapLogoImg.dataset.map = mapVal;
            mapLogoImg.src = '/assets/game/maps/' + encodeURIComponent(mapVal) + '.png';
          }
        }

        /* #scene background — a star match (Epic Rivalry, Enduring
           Legacy, etc.) uses its own draftbg variant when one exists for
           the active theme, checked at runtime (see setBgWithFallback
           above) rather than hardcoded per matchType, so this covers
           both Regular's and 10th Anniversary's assets/draft(/anniversary)/
           folders uniformly and falls back to the plain themed
           background if that matchType has no art for this theme. */
        var curMatch   = (s.todayMatches || [])[(s.match || 1) - 1];
        var isEnduring = curMatch && curMatch.matchType === 'enduring';
        var isPlayoffsTheme = document.documentElement.getAttribute('data-theme') === 'playoffs';
        var draftBase  = 'assets/overlay/draft/' + (isAnniversaryTheme() ? 'anniversary/' : isPlayoffsTheme ? 'playoffs/' : '');
        var draftPlain = draftBase + 'draftbg.png';
        /* Playoffs has star-match variants for Epic Rivalry / Enduring Legacy
           (assets/overlay/draft/playoffs/draftbg_<SUFFIX>.png); any other matchType
           has no file there and falls back to the plain background. */
        var starSuffix = curMatch && starSuffixFor(curMatch.matchType);
        var draftStar  = starSuffix ? draftBase + 'draftbg_' + starSuffix + '.png' : draftPlain;
        setBgWithFallback(scene, draftStar, draftPlain);

        /* #team-c1/#team-c2 sit directly on that background's gold panel
           in the Enduring Legacy art (white elsewhere), so they need to
           flip to black only for that matchType. */
        var teamC1 = document.getElementById('team-c1');
        var teamC2 = document.getElementById('team-c2');
        if (teamC1) teamC1.style.color = isEnduring ? '#0a0a0a' : '#fff';
        if (teamC2) teamC2.style.color = isEnduring ? '#0a0a0a' : '#fff';
      })
      .catch(function() {});
  }

  /* Moves the map icon from its closed box (#draft-map-logo) into the
     open target box (#draft-map-logo-open) with one transform (origin 0 0,
     uniform scale, centred in the target so the art never squashes).
     Both boxes are px-positioned children of #draft-map, so computed
     left/top/width/height are valid even while the scene is hidden. */
  function mapDetail2LogoSync() {
    var bug  = document.getElementById('draft-map');
    var logo = document.getElementById('draft-map-logo');
    var tgt  = document.getElementById('draft-map-logo-open');
    if (!bug || !logo || !tgt) return;
    if (!bug.classList.contains('draft-map-v2-open')) { logo.style.transform = ''; return; }
    var a = getComputedStyle(logo), b = getComputedStyle(tgt);
    var L = parseFloat(a.left) || 0, T = parseFloat(a.top) || 0;
    var W = parseFloat(a.width) || 1, H = parseFloat(a.height) || 1;
    var L2 = parseFloat(b.left) || 0, T2 = parseFloat(b.top) || 0;
    var W2 = parseFloat(b.width) || W, H2 = parseFloat(b.height) || H;
    var k = Math.min(W2 / W, H2 / H);
    var dx = L2 + (W2 - W * k) / 2 - L, dy = T2 + (H2 - H * k) / 2 - T;
    logo.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')';
  }
  function mapDetail2ApplyCmd(action) {
    var bug = document.getElementById('draft-map');
    if (action === 'show') {
      if (!MAPDETAIL_TEXT[mapDetailCurrentMap]) return;
      md2DescEl.textContent = MAPDETAIL_TEXT[mapDetailCurrentMap];
      md2PlateEl.classList.add('md2-open');
      if (bug) bug.classList.add('draft-map-v2-open');
    } else if (action === 'hide') {
      md2PlateEl.classList.remove('md2-open');
      if (bug) bug.classList.remove('draft-map-v2-open');
    }
    mapDetail2LogoSync();
  }

  /* Coach name fit — maximize a single line to fill the 27px-tall box;
     only wrap to two (smaller) lines when a name genuinely doesn't fit
     on one, e.g. "MASTER THE BASICS" vs. the usual short coach names. */
  function dcoachFitName(el, nameStr) {
    var maxW = 129, maxH = 27;

    function fitsOneLine(size) {
      el.textContent      = nameStr;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = maxH + 'px';
      return el.scrollWidth <= maxW;
    }

    /* Single line, maximized: the largest size — down to a floor below
       which it'd look too small — that fits the width at full box
       height. Covers the common case ("most coaches have short names"). */
    var ceiling = maxH - 3, floor = 15;
    for (var s = ceiling; s >= floor; s--) {
      if (fitsOneLine(s)) return;
    }

    /* Doesn't fit on one line even at the floor size (e.g. "MASTER THE
       BASICS") — force an explicit two-line break at the most balanced
       word boundary (rather than relying on natural reflow, which can
       coincidentally settle back onto one cramped line at this box's
       width). Keep the SAME size range single-line uses instead of
       shrinking further just because it wrapped — each line only needs
       to fit the box WIDTH; the stacked pair is allowed to exceed the
       box's height. */
    var words = nameStr.split(' ');
    var line1 = nameStr, line2 = '';
    if (words.length > 1) {
      var best = 1, bestDiff = Infinity;
      for (var i = 1; i < words.length; i++) {
        var l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' ');
        var diff = Math.abs(l1.length - l2.length);
        if (diff < bestDiff) { bestDiff = diff; best = i; }
      }
      line1 = words.slice(0, best).join(' ');
      line2 = words.slice(best).join(' ');
    }
    function fitsTwoLines(size) {
      el.innerHTML        = line1 + '<br>' + line2;
      el.style.whiteSpace = 'nowrap';
      el.style.fontSize   = size + 'px';
      el.style.lineHeight = (size + 1) + 'px';
      return el.scrollWidth <= maxW;
    }
    for (var s2 = ceiling; s2 >= floor; s2--) {
      if (fitsTwoLines(s2)) return;
    }
    /* Extremely long individual word(s) — only now drop below the
       single-line floor, since the horizontal bound still can't be
       crossed. */
    for (var s3 = floor - 1; s3 >= 7; s3--) {
      if (fitsTwoLines(s3)) return;
    }
    fitsTwoLines(7); /* smallest fallback if even that won't fit */
  }

  function buildCoachBpm() {
    buildCoachSide('home');
    buildCoachSide('away');
    /* Left blank (and headset hidden, per buildCoachSide) until poll()
       gets a real coach_in from the draft API — see updateCoachFromDraft. */
  }

  /* Coach name + headset visibility, driven by the draft API's per-camp
     coach_in (see poll()). campid is already positional (1=blue/left,
     2=red/right — same convention as everywhere else in this codebase),
     so unlike the BPM feed's coach_home1/coach_away1 pairing this needs
     no swap logic: camp1 always maps to 'home' (left), camp2 to 'away'
     (right). "Unknown" (the API's not-yet-set sentinel) and any other
     falsy value are treated the same — blank name, headset hidden. */
  function updateCoachFromDraft(side, coachIn) {
    var refs = dcoachRefs[side];
    if (!refs) return;
    var known = !!coachIn && coachIn !== 'Unknown';
    dcoachFitName(refs.nameTextEl, known ? coachIn : '');
    if (refs.headsetEl) refs.headsetEl.style.display = known ? '' : 'none';
  }

  /* Heartbeat scale bump, phase-driven by actual BPM — same easing curve
     as ingame_blue.html's bpmAnimate so the coach heart beats in time. */
  var dcoachLast = 0;
  function dcoachAnimate(ts) {
    var dt = (ts - (dcoachLast || ts)) / 1000;
    dcoachLast = ts;
    ['home', 'away'].forEach(function(side) {
      var h = dcoachRefs[side];
      if (!h) return;
      var active = h.bpm > 0 && h.connected;
      if (active) h.phase = (h.phase + (h.bpm / 60) * dt) % 1;
      var beat = 0;
      if (active && h.phase >= 0.22 && h.phase <= 0.50) {
        beat = Math.pow(1 - (h.phase - 0.22) / 0.28, 4);
      }
      h.heartEl.style.transform = 'scale(' + (1 + beat * 0.4).toFixed(3) + ')';
    });
    requestAnimationFrame(dcoachAnimate);
  }

  function pollCoachBpm() {
    fetch('/feed', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!Array.isArray(list)) return;
        /* LEFT box (home position) is camp1 — coach_home1 unless swapped,
           matching pollMatchState()'s c1Team/c2Team logic. */
        var pairs = dcoachSwapped
          ? [['home', 'coach_away1'], ['away', 'coach_home1']]
          : [['home', 'coach_home1'], ['away', 'coach_away1']];
        pairs.forEach(function(pair) {
          var side = pair[0], slot = pair[1];
          var h = dcoachRefs[side];
          if (!h) return;
          var entry = list.find(function(e) { return e.slot === slot; });
          var bpm = entry ? (parseInt(entry.bpm) || 0) : 0;
          h.bpm = bpm;
          h.connected = !!entry && bpm > 0;
          h.numEl.textContent   = h.connected ? bpm : '--';
          h.heartEl.style.color = h.connected ? '#e8121f' : '#999';
        });
      })
      .catch(function() {});
  }

  /* Shrink-to-fit — same binary-search approach as overlay-scoreboard.js's
     sbFitText, since "Expanding Rivers" runs much longer than "Flying
     Cloud" inside the same fixed-width name box. */
  function draftFitText(el, maxWidth, maxPx) {
    maxPx = maxPx || 13;
    el.style.fontSize = maxPx + 'px';
    if (el.scrollWidth <= maxWidth) return;
    var lo = 6, hi = maxPx;
    while (hi - lo > 0.5) {
      var mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxWidth) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + 'px';
  }

  /* ── Sponsor loop ──────────────────────────────────────────── */
  var SPONSORS = [];
  var sponsorIdx = 0;

  function startSponsorLoop() {
    fetch('/api/sponsors' + SponsorSet.qs())
      .then(function(r) { return r.json(); })
      .then(function(list) {
        if (!list || !list.length) return;
        SPONSORS = list;
        runSponsorLoop();
      })
      .catch(function() {});
  }

  function runSponsorLoop() {
    var img = document.getElementById('sponsor-img');
    (function nextSponsor() {
      var s = SPONSORS[sponsorIdx];
      img.className = '';
      img.src = s.src;
      void img.offsetWidth;
      img.classList.add('spon-in');

      function onIn(ev) {
        if (ev.propertyName !== 'transform') return;
        img.removeEventListener('transitionend', onIn);
        setTimeout(function() {
          img.classList.remove('spon-in');
          img.classList.add('spon-out');
          function onExit(ev) {
            if (ev.propertyName !== 'transform') return;
            img.removeEventListener('transitionend', onExit);
            sponsorIdx = (sponsorIdx + 1) % SPONSORS.length;
            nextSponsor();
          }
          img.addEventListener('transitionend', onExit);
        }, s.dur);
      }
      img.addEventListener('transitionend', onIn);
    })();
  }

  /* ── Player photo sequence (FRONT → VICTORY) ───────────────── */
  function clearPhotoTimers(p) {
    if (p.photoTimer0) { clearTimeout(p.photoTimer0); p.photoTimer0 = null; }
    if (p.photoTimer1) { clearTimeout(p.photoTimer1); p.photoTimer1 = null; }
    if (p.photoTimer2) { clearTimeout(p.photoTimer2); p.photoTimer2 = null; }
  }

  function resetPlayerPhoto(e, p) {
    clearPhotoTimers(p);
    e.photoImg.className   = 'player-photo';
    e.photoImg.style.display = 'none';
    e.photoImg.style.opacity = '0';
    e.photoImg.style.transform = '';
    e.photoImg.src = '';
    e.photoCanvas.style.opacity = '0';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    e.photoH = null;
    p.photoName    = undefined;
    p.photoPhase   = 'none';
    p.photoErasing = false;
  }

  var PHOTO_FRONT_EASE_MS = 600; /* matches .photo-entering CSS duration */
  var PHOTO_FRONT_HOLD_MS = 500;
  var PHOTO_QUICKOUT_MS   = 150; /* matches .photo-quick-out CSS duration */

  /* Role icon takes 550ms to press + 900ms to fly to its corner (see the
     'pressing' setTimeout below) — hold the photo off-screen until it has
     mostly cleared the centre so the two don't overlap. Trimmed 550ms off
     the full 1450ms clear time to keep the entrance snappier. */
  var ROLE_ICON_DEPART_MS = 550 + 900 - 300 - 250;

  /* Picking animation (pickingblue/red.webm) — same "wait for the role icon
     to clear" delay as the player photo, then a plain opacity fade in
     rather than popping straight to visible. */
  function showPickAnimDelayed(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = setTimeout(function () {
      e.pickAnim.currentTime = 0;
      e.pickAnim.play().catch(function () {});
      e.pickAnim.classList.add('pick-anim-visible');
    }, ROLE_ICON_DEPART_MS);
  }

  function hidePickAnim(e, p) {
    clearTimeout(p.pickAnimTimer);
    p.pickAnimTimer = null;
    e.pickAnim.classList.remove('pick-anim-visible');
    e.pickAnim.pause();
  }

  /* Waits for the role icon to clear, then: FRONT fades+eases up → holds
     0.5s → quick fade-out → VICTORY bounces in. 'live' mode matches the
     seat's real player name to a photo (skips if no match yet); 'random'
     mode picks any available name — for testing only. */
  function startPlayerPhotoSequence(e, p, playerName) {
    var name;
    if (draftPhotoMode === 'random') {
      if (!PLAYER_PHOTO_NAMES.length) return;
      name = PLAYER_PHOTO_NAMES[Math.floor(Math.random() * PLAYER_PHOTO_NAMES.length)];
    } else {
      name = PLAYER_PHOTO_LOOKUP[(playerName || '').trim().toLowerCase()];
      if (!name) return;
    }
    resetPlayerPhoto(e, p);
    p.photoName = name;

    p.photoTimer0 = setTimeout(function () {
      beginPhotoFrontPhase(e, p, name);
    }, ROLE_ICON_DEPART_MS);
  }

  function beginPhotoFrontPhase(e, p, name) {
    p.photoPhase = 'front';

    var img = e.photoImg;
    img.src = 'assets/photo/FRONT/' + name + '_FRONT_resized.webp';
    img.style.display = 'block';
    img.style.opacity = '0';
    img.className = 'player-photo photo-front-size';
    void img.offsetWidth;
    img.classList.add('photo-entering');

    p.photoTimer1 = setTimeout(function () {
      img.classList.remove('photo-entering');
      /* Removing 'photo-entering' drops its animation-driven transform,
         which would otherwise snap back to the base (pre-entrance, lower)
         translateY — pin it at the settled position so the fade-out doesn't
         visibly jump before it starts. */
      img.style.transform = 'translateX(-50%) translateY(0)';
      img.classList.add('photo-quick-out');
      p.photoTimer2 = setTimeout(function () {
        img.src = 'assets/photo/VICTORY/' + name + '_VICTORY_resized.webp';
        img.className = 'player-photo';
        img.style.opacity = '0';
        void img.offsetWidth;
        img.classList.add('photo-bounce-in');
        p.photoPhase = 'victory';
      }, PHOTO_QUICKOUT_MS);
    }, PHOTO_FRONT_EASE_MS + PHOTO_FRONT_HOLD_MS);
  }

  /* Draws the currently-visible photo into the erase canvas (at the photo's
     own — larger — resolution) and shows it in place of the <img>, so
     per-frame alpha updates can take over. */
  function preparePhotoErase(e, p) {
    if (!p.photoName || p.photoPhase === 'none') {
      /* Hero was picked before the delayed front-phase ever showed anything
         (faster than ROLE_ICON_DEPART_MS) — cancel the pending timer instead
         of erasing a photo that was never drawn. */
      resetPlayerPhoto(e, p);
      return;
    }
    p.photoErasing = true;

    var natW = e.photoImg.naturalWidth  || PHOTO_W;
    var natH = e.photoImg.naturalHeight || Math.round(PHOTO_W * 1.6);
    var Hp   = Math.round(natH * PHOTO_W / natW);

    e.photoH = Hp;
    e.photoCanvas.width  = PHOTO_W;
    e.photoCanvas.height = Hp;
    e.photoCanvas.style.height = Hp + 'px';

    /* No readback: the erase is composited on the GPU every frame in
       updatePhotoErase (photo drawn, then heroMatteVid's baked alpha
       knocked out of it with destination-out), so all that's needed
       here is to size the canvas and paint the first frame. */
    updatePhotoErase(e, null);
    e.photoCanvas.style.opacity = '1';
    e.photoImg.style.opacity = '0';
  }

  /* Erases the photo using the SAME matte mask that reveals the hero video —
     resampled at the photo's own resolution so the wipe aligns with its size.
     Wherever the mask reveals the hero, the photo fades by the complement. */
  function updatePhotoErase(e, maskVid) {
    if (!e.photoH) return;
    var ctx = e.photoCtx, Hp = e.photoH;
    ctx.clearRect(0, 0, PHOTO_W, Hp);
    ctx.drawImage(e.photoImg, 0, 0, PHOTO_W, Hp);
    if (maskVid) {
      /* heroMatteVid's alpha = 255 - matteLuma, i.e. exactly the amount the
         hero is revealed; destination-out leaves photoAlpha * (1 - reveal),
         the same fade-by-the-complement as before, but as one GPU
         composite instead of getImageData + a per-pixel JS loop +
         putImageData every frame. (Only differs from the old
         Math.min(photoAlpha, 1 - reveal) on the photo's semi-transparent
         edge pixels, mid-erase.) */
      ctx.globalCompositeOperation = 'destination-out';
      ctx.drawImage(maskVid, 0, 0, PHOTO_W, Hp);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function finishPhotoErase(e, p) {
    p.photoErasing = false;
    e.photoH = null;
    e.photoCanvas.style.opacity = '0';
    e.photoImg.style.display = 'none';
    e.photoCtx.clearRect(0, 0, e.photoCanvas.width, e.photoCanvas.height);
    p.photoName  = undefined;
    p.photoPhase = 'none';
  }

  /* Per-pixel alpha derived from a matte-video sample at index i (RGBA offset).
     Shared by the hero reveal and the photo erase so both read the same mask. */
  function matteAlphaAt(m, i) {

      ? 255 - m[i + 3]

  var BUFF_BADGE_CLASS = { NERF: 'dstats-buff-nerf', BUFF: 'dstats-buff-buff', ADJUST: 'dstats-buff-adjust' };
